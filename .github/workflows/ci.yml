name: CI

on:
  push:
    branches: [MyDoMo, 'mydomo-*']
  pull_request:
    branches: [MyDoMo]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, curl, pdo_mysql, sqlite3
          coverage: none

      - name: Validate Composer
        run: |
          composer validate --strict
          composer audit --no-dev

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP
        run: composer check

      - name: Legacy contract smoke tests
        run: |
          php tests/config_smoke.php
          php tests/routing_smoke.php
          php tests/docs_quality_smoke.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build
