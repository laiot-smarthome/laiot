services:
  app:
    build: ./docker/app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_TIMEZONE: Europe/Moscow
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: mydomo
      DB_USER: mydomo
      DB_PASSWORD: mydomo
      CACHE_DRIVER: file
      MYDOMO_ADMIN_USER: admin
      MYDOMO_ADMIN_NAME: Администратор
      MYDOMO_ADMIN_PASSWORD: majordomo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: mydomo
      MARIADB_USER: mydomo
      MARIADB_PASSWORD: mydomo
    volumes:
      - mydomo-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mydomo-db:
