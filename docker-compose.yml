# Локальный стенд LaIOT.
#
# app — php-fpm для nginx; worker-events и worker-mqtt — фоновые процессы,
# которые в production запускаются через systemd. init выполняет миграции и
# создание администратора один раз, остальные сервисы ждут его завершения.
#
# 2026-10-27 — MQTT и события свойства работают в контейнерах, а не только вручную.

x-laiot-app: &laiot-app
  build: ./docker/app
  volumes:
    - ./:/var/www/html

x-laiot-env: &laiot-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_TIMEZONE: Europe/Moscow
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: laiot
  DB_USER: laiot
  DB_PASSWORD: laiot
  CACHE_DRIVER: file
  LAIOT_ADMIN_USER: sysadmin
  LAIOT_ADMIN_NAME: Администратор
  LAIOT_ADMIN_PASSWORD: laiot!

services:
  init:
    <<: *laiot-app
    command: ["true"]
    environment: *laiot-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    <<: *laiot-app
    expose:
      - "9000"
    environment: *laiot-env
    depends_on:
      init:
        condition: service_completed_successfully

  # События свойства: OnChange, история и постановка доставки в module.mqtt.
  worker-events:
    <<: *laiot-app
    entrypoint: ["php"]
    command: ["bin/laiot", "core-worker", "events"]
    environment: *laiot-env
    user: "www-data"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  # Приём и отправка MQTT: одно долгоживущее соединение с брокером.
  worker-mqtt:
    <<: *laiot-app
    entrypoint: ["php"]
    command: ["bin/laiot", "worker", "mqtt"]
    environment: *laiot-env
    user: "www-data"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: laiot
      MARIADB_USER: laiot
      MARIADB_PASSWORD: laiot
    volumes:
      - laiot-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  laiot-db:
