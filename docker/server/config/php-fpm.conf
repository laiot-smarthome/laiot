; 2026-10-30 — HTTP и CLI обновления работают от одного владельца Linux-файлов.
[laiot]
user = laiot
group = laiot
listen = /run/php/php8.3-fpm-laiot.sock
listen.owner = laiot
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
