# 2026-10-30 — отдельный чистый Linux-стенд для установки, обновления и восстановления.
name: laiot-server

services:
  server:
    build:
      context: ../..
      dockerfile: docker/server/Dockerfile
    image: laiot-server:local
    hostname: laiot-server
    environment:
      container: docker
      TZ: Europe/Moscow
      LAIOT_SERVER_URL: http://127.0.0.1:${LAIOT_SERVER_PORT:-8082}
    ports:
      - "127.0.0.1:${LAIOT_SERVER_PORT:-8082}:80"
    # systemd управляет только собственной иерархией контейнера; host cgroup не монтируется.
    cgroup: private
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - application:/srv/laiot
      - database:/var/lib/mysql
      - configuration:/etc/laiot
      - redis:/var/lib/redis
    stop_signal: SIGRTMIN+3
    stop_grace_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet nginx php8.3-fpm mariadb laiot-agent && curl --fail --silent --output /dev/null http://127.0.0.1/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  application:
  database:
  configuration:
  redis:
