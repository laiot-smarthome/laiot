; Локальный стенд LaIOT: nginx ходит в этот пул по app:9000.
; В production те же параметры задаются в pool.d на хосте; приложение их
; не читает (см. docs/laiot/runtime.md).
[www]
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Потолок одного HTTP-запроса: синхронный запуск сценария с ядром не должен
; держать воркер бесконечно. Режим «без ядра» ограничен в приложении (10 с).
request_terminate_timeout = 60s
